</linearGradient>
<clipPath id="tileClip"><rect x="40" y="40" width="120" height="120" rx="26"/></clipPath>
</defs>

<rect x="40" y="40" width="120" height="120" rx="26" fill="url(#tileBg)" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
